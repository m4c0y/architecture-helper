[project]
name = "archtools"
version = "0.1.0"
description = "Ferramentas determinísticas para projetos de arquitetura e interiores"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
archtools = "archtools.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
